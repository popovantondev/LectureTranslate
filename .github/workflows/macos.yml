name: macOS offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Run local test suite
        run: /bin/bash Scripts/test-all.sh
      - name: Build isolated preview app
        run: /bin/bash Scripts/build.sh --preview
      - name: Check release archive safeguards
        run: /usr/bin/ruby Tests/ReleaseTests.rb
      - name: Check sanitized public export
        run: /bin/bash Scripts/test-public-export.sh
