name: Quota connection stress diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quota-stress:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Compile and run the quota connection fixture
        run: /bin/bash Scripts/test-quota-connection.sh
      - name: Repeat the existing quota connection tests
        run: |
          for attempt in {2..20}; do
            echo "Quota connection stress iteration $attempt"
            .build/QuotaConnectionTests
          done
